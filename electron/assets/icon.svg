<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="wingUpper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>
    <linearGradient id="wingLower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#881337" flood-opacity="0.35"/>
    </filter>
    <filter id="planeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="10" flood-color="#881337" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="none" stroke="#fecdd3" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Courier Send Paper Airplane Icon -->
  <g filter="url(#planeShadow)">
    <!-- Lower wing (shaded for depth) -->
    <polygon points="415,98 310,408 248,268"
             fill="url(#wingLower)"
             stroke="#ffffff"
             stroke-width="5"
             stroke-linejoin="round"/>

    <!-- Upper wing (highlighted) -->
    <polygon points="415,98 248,268 108,208"
             fill="url(#wingUpper)"
             stroke="#ffffff"
             stroke-width="5"
             stroke-linejoin="round"/>

    <!-- Crease spine -->
    <line x1="415" y1="98" x2="248" y2="268"
          stroke="#e11d48"
          stroke-width="4"
          stroke-linecap="round"/>
  </g>
</svg>
